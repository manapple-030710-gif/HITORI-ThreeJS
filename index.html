<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e5e7e6" />
    <title>HITORI — Environment 01</title>
  </head>
  <body>
    <main id="stage" aria-label="白い空と静かな水面の環境映像"></main>
    <div id="interface">
      <header><span class="wordmark">HITORI</span><span class="subtitle">ENVIRONMENT STUDY / 01</span></header>
      <aside>
        <details>
          <summary>環境を調整 <span>＋</span></summary>
          <div class="controls">
            <p>静かな水面 / OVERCAST</p>
            <label>光の強さ <output id="light-value"></output><input id="light" type="range" min="0.6" max="1.3" step="0.01"></label>
            <label>水の速さ <output id="speed-value"></output><input id="speed" type="range" min="0" max="0.5" step="0.01"></label>
            <label>水面の揺らぎ <output id="waves-value"></output><input id="waves" type="range" min="0" max="1" step="0.01"></label>
            <label class="color">空の色 <input id="sky-color" type="color" aria-label="空の色"></label>
            <label>霧の開始距離 <output id="fog-start-value"></output><input id="fog-start" type="range" min="0" max="200" step="1"></label>
            <label>霧の濃さ <output id="fog-density-value"></output><input id="fog-density" type="range" min="0" max="0.01" step="0.0001"></label>
            <label class="color">霧の色 <input id="fog-color" type="color" aria-label="霧の色"></label>
            <button id="reset">初期設定に戻す</button>
          </div>
        </details>
      </aside>
      <footer><span>FIXED CAMERA <i></i> 1920 × 1080</span><div><button id="pause">一時停止</button><button id="capture">PNG保存</button><button id="fullscreen">全画面</button><button id="hide">UIを隠す [H]</button></div></footer>
    </div>
    <button id="restore" hidden>操作を表示 [H]</button>
    <div id="error" role="alert" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
