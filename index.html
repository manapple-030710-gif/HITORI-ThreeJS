<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e5e7e6" />
    <title>HITORI — Environment 01</title>
  </head>
  <body>
    <main id="stage" aria-label="白い空と静かな水面の環境映像"></main>
    <div id="interface">
      <header><span class="wordmark">HITORI</span><span class="subtitle">ENVIRONMENT STUDY / 01</span></header>
      <aside>
        <details>
          <summary>環境を調整 <span>＋</span></summary>
          <div class="controls">
            <p>静かな水面 / SKY STUDY</p>
            <label>カメラプリセット <select id="camera-preset"><option value="close">Close / BGM</option><option value="wide">Wide / Ambient</option><option value="custom">Custom</option></select></label>
            <label>空プリセット <select id="sky-preset"><option>Morning</option><option selected>Overcast</option><option>Evening</option><option>Night</option><option>Custom</option></select></label>
            <button id="choose-sky-image" type="button">空画像を選択</button>
            <input id="sky-image" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" hidden>
            <p id="sky-image-status" role="status">PNG / JPG / WebP</p>
            <label class="auto-link"><input id="sky-auto-link" type="checkbox" aria-describedby="auto-link-note"> 自動連動</label>
            <p id="auto-link-note">空画像の色に霧・水面・光を馴染ませます。OFFで手動設定に戻ります。</p>
            <label>光の強さ <output id="light-value"></output><input id="light" type="range" min="0.6" max="1.3" step="0.01"></label>
            <label>水の速さ <output id="speed-value"></output><input id="speed" type="range" min="0" max="0.5" step="0.01"></label>
            <label>水面の揺らぎ <output id="waves-value"></output><input id="waves" type="range" min="0" max="2.5" step="0.01"></label>
            <label>霧の濃さ <output id="fog-density-value"></output><input id="fog-density" type="range" min="0" max="0.01" step="0.0001"></label>
            <label>境界ブレンド幅 <output id="horizon-blend-value" for="horizon-blend"></output><input id="horizon-blend" type="range" min="0" max="2" step="0.05" title="地平線のなじみ幅を調整（度）"></label>
            <button id="reset">初期設定に戻す</button>
            <details class="advanced-settings">
              <summary>詳細設定 <span>＋</span></summary>
              <details class="advanced-settings">
                <summary>波の流れ <span>＋</span></summary>
                <label>大波の強さ <output id="large-wave-strength-value"></output><input id="large-wave-strength" type="range" min="0" max="3" step="0.01"></label>
                <label>大波の波長 <output id="large-wave-scale-value"></output><input id="large-wave-scale" type="range" min="3" max="30" step="0.1"></label>
                <label>大波の速さ <output id="large-wave-speed-value"></output><input id="large-wave-speed" type="range" min="0" max="3" step="0.01"></label>
                <label>中波の強さ <output id="medium-wave-strength-value"></output><input id="medium-wave-strength" type="range" min="0" max="4" step="0.01"></label>
                <label>中波の波長 <output id="medium-wave-scale-value"></output><input id="medium-wave-scale" type="range" min="0.8" max="8" step="0.1"></label>
                <label>中波の速さ <output id="medium-wave-speed-value"></output><input id="medium-wave-speed" type="range" min="0" max="4" step="0.01"></label>
                <label>小波の強さ <output id="small-wave-strength-value"></output><input id="small-wave-strength" type="range" min="0" max="4" step="0.01"></label>
                <label>小波の波長 <output id="small-wave-scale-value"></output><input id="small-wave-scale" type="range" min="0.15" max="2" step="0.01"></label>
                <label>小波の速さ <output id="small-wave-speed-value"></output><input id="small-wave-speed" type="range" min="0" max="4" step="0.01"></label>
                <label>方向の広がり <output id="direction-spread-value"></output><input id="direction-spread" type="range" min="0" max="2" step="0.01"></label>
                <label>速度のばらつき <output id="wave-speed-variation-value"></output><input id="wave-speed-variation" type="range" min="0" max="2" step="0.01"></label>
                <label>波頭の鋭さ <output id="wave-sharpness-value"></output><input id="wave-sharpness" type="range" min="0" max="1" step="0.01"></label>
                <label>反射面の散り <output id="specular-scatter-value"></output><input id="specular-scatter" type="range" min="0" max="2" step="0.01"></label>
              </details>
              <label>露出 <output id="exposure-value"></output><input id="exposure" type="range" min="0.5" max="1.5" step="0.01"></label>
              <label>環境光の強さ <output id="environment-intensity-value"></output><input id="environment-intensity" type="range" min="0" max="1.5" step="0.01"></label>
              <div id="camera-custom" hidden>
                <label>Camera X <input id="camera-x" type="number" min="-1000" max="1000" step="any"></label>
                <label>Camera Y <input id="camera-y" type="number" min="0.3" max="100" step="any"></label>
                <label>Camera Z <input id="camera-z" type="number" min="-1000" max="1000" step="any"></label>
                <label>Look At X <input id="look-at-x" type="number" min="-1000" max="1000" step="any"></label>
                <label>Look At Y <input id="look-at-y" type="number" min="-100" max="100" step="any"></label>
                <label>Look At Z <input id="look-at-z" type="number" min="-1000" max="1000" step="any"></label>
                <label>FOV <input id="camera-fov" type="number" min="15" max="90" step="any"></label>
                <p id="camera-input-status" role="status"></p>
              </div>
              <label>地平線サンプル位置 <output id="sky-sample-value" for="sky-sample">55%</output><input id="sky-sample" type="range" min="45" max="80" step="1" value="55"></label>
              <label class="color">空の色 <input id="sky-color" type="color" aria-label="空の色"></label>
              <label>水の色補正 <select id="water-color-correction"><option value="none">補正なし</option><option value="soften">色味を弱める</option><option value="white">少し白寄り</option><option value="gray">少し灰寄り</option><option value="blue">少し青寄り</option></select></label>
              <details class="advanced-settings">
                <summary>水の材質 <span>＋</span></summary>
                <details class="advanced-settings">
                  <summary>仮の水底 <span>＋</span></summary>
                  <label>底の見え方 <output id="bottom-visibility-value"></output><input id="bottom-visibility" type="range" min="0" max="1" step="0.01"></label>
                  <label class="color">底の色 <input id="bottom-tint" type="color" aria-label="底の色"></label>
                  <label>底の明暗差 <output id="bottom-variation-strength-value"></output><input id="bottom-variation-strength" type="range" min="0" max="0.6" step="0.01"></label>
                  <label>底の明暗の密度 <output id="bottom-variation-scale-value"></output><input id="bottom-variation-scale" type="range" min="0.03" max="0.4" step="0.01"></label>
                  <label>底の遠景減衰 <output id="depth-fade-strength-value"></output><input id="depth-fade-strength" type="range" min="0.75" max="2.5" step="0.01"></label>
                </details>
                <details class="advanced-settings">
                  <summary>浅深・局所変化 <span>＋</span></summary>
                  <label class="color">浅い水の色 <input id="shallow-color" type="color" aria-label="浅い水の色"></label>
                  <label class="color">深い水の色 <input id="deep-color" type="color" aria-label="深い水の色"></label>
                  <label>浅深色差の強さ <output id="depth-variation-strength-value"></output><input id="depth-variation-strength" type="range" min="0" max="0.5" step="0.01"></label>
                  <label>浅深色差の密度 <output id="depth-variation-scale-value"></output><input id="depth-variation-scale" type="range" min="0.02" max="0.3" step="0.01"></label>
                  <label>ハイライトのムラ <output id="highlight-variation-value"></output><input id="highlight-variation" type="range" min="0" max="0.5" step="0.01"></label>
                  <label>ハイライトのムラの密度 <output id="highlight-variation-scale-value"></output><input id="highlight-variation-scale" type="range" min="0.03" max="0.5" step="0.01"></label>
                  <label>水中の明度揺らぎ <output id="caustic-strength-value"></output><input id="caustic-strength" type="range" min="0" max="0.12" step="0.001"></label>
                  <label>水中の明度揺らぎの密度 <output id="caustic-scale-value"></output><input id="caustic-scale" type="range" min="0.1" max="1.5" step="0.01"></label>
                  <label>水中の明度揺らぎの速さ <output id="caustic-speed-value"></output><input id="caustic-speed" type="range" min="0" max="0.5" step="0.01"></label>
                </details>
                <label>ハイライトの強さ <output id="specular-strength-value"></output><input id="specular-strength" type="range" min="0" max="1" step="0.01"></label>
                <label>ハイライトの鋭さ <output id="specular-sharpness-value"></output><input id="specular-sharpness" type="range" min="8" max="160" step="1"></label>
                <label>水面の光方向 X <output id="light-direction-x-value"></output><input id="light-direction-x" type="range" min="-1" max="1" step="0.01"></label>
                <label>水面の光方向 Y <output id="light-direction-y-value"></output><input id="light-direction-y" type="range" min="-1" max="1" step="0.01"></label>
                <label>水面の光方向 Z <output id="light-direction-z-value"></output><input id="light-direction-z" type="range" min="-1" max="1" step="0.01"></label>
                <label>微細な揺らぎの強さ <output id="micro-normal-strength-value"></output><input id="micro-normal-strength" type="range" min="0" max="0.025" step="0.001"></label>
                <label>微細な揺らぎの密度 <output id="micro-normal-scale-value"></output><input id="micro-normal-scale" type="range" min="1" max="12" step="0.1"></label>
                <label>微細な揺らぎの速さ <output id="micro-normal-speed-value"></output><input id="micro-normal-speed" type="range" min="0" max="0.6" step="0.01"></label>
                <label class="color">水の色 <input id="water-color" type="color" aria-label="水の色"></label>
                <label>近景の不透明度 <output id="water-opacity-value"></output><input id="water-opacity" type="range" min="0" max="1" step="0.01"></label>
                <label>表面の粗さ <output id="water-roughness-value"></output><input id="water-roughness" type="range" min="0.04" max="0.65" step="0.01"></label>
                <label>角度による反射 <output id="water-fresnel-value"></output><input id="water-fresnel" type="range" min="0" max="1.5" step="0.01"></label>
                <label>反射の強さ <output id="water-reflection-value"></output><input id="water-reflection" type="range" min="0" max="1.5" step="0.01"></label>
                <label>水の層の色づき <output id="water-depth-tint-value"></output><input id="water-depth-tint" type="range" min="0" max="2" step="0.01"></label>
              </details>
              <label class="color">霧の色 <input id="fog-color" type="color" aria-label="霧の色"></label>
              <label>霧の開始距離 <output id="fog-start-value"></output><input id="fog-start" type="range" min="0" max="200" step="1"></label>
              <label>時刻 <output id="sky-time-value" for="sky-time">12:00</output><input id="sky-time" type="range" min="0" max="24" step="0.016666666666666666" value="12"></label>
            </details>
          </div>
        </details>
      </aside>
      <footer><span>FIXED CAMERA <i></i> 1920 × 1080</span><div><button id="pause">一時停止</button><button id="capture">PNG保存</button><button id="fullscreen">全画面</button><button id="hide">UIを隠す [H]</button></div></footer>
    </div>
    <button id="restore" hidden>操作を表示 [H]</button>
    <div id="error" role="alert" hidden></div>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
